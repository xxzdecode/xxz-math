<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数学知识点库</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="ui-state.css"></head>
<body>
  <header class="site-header"><a class="brand" href="index.html"><span>∠</span> 数学图形实验室</a><nav><a href="index.html">图形实验室</a><a class="active" href="knowledge.html">知识点库</a></nav><button class="teacher-button" data-teacher-login>老师入口</button></header>
  <main class="page-shell">
    <section class="page-title"><p class="eyebrow">一至七年级 · 由浅入深</p><h1>数学知识点库</h1><p>按年级从低到高整理。点击知识点就在原位置展开定义、方法、算例和易错点；图形公式集中放在图形实验室。</p></section>
    <p class="notice" id="teacherProgressHint">当前为公共视图。学生状态需要进入老师模式。</p>
    <div class="student-switch" id="studentSwitch" hidden></div>
    <p class="inline-status" id="knowledgeStatus" aria-live="polite"></p>
    <section class="knowledge-toolbar" aria-label="知识点筛选">
      <label>搜索<input id="knowledgeSearch" type="search" placeholder="知识点、章节、公式或能力标签…" autocomplete="off"></label>
      <label>年级<select id="gradeFilter"><option value="all">全部年级</option><option value="1">一年级</option><option value="2">二年级</option><option value="3">三年级</option><option value="4">四年级</option><option value="5">五年级</option><option value="6">六年级</option><option value="7">七年级</option></select></label>
      <label>领域<select id="domainFilter"><option value="all">全部领域</option></select></label>
      <div class="knowledge-expand-actions" aria-label="展开控制"><button id="expandAll" type="button">全部展开</button><button id="collapseAll" type="button">全部收起</button></div>
    </section>
    <section class="knowledge-summary" aria-label="知识点统计">
      <div><strong id="visibleKnowledgeCount">0</strong><span>当前显示</span></div>
      <div><strong id="visibleGradeCount">0</strong><span>年级</span></div>
      <div><strong id="visibleDomainCount">0</strong><span>知识领域</span></div>
    </section>
    <section class="teacher-summary" id="teacherSummary" hidden></section>
    <div id="knowledgeGroups"></div>
    <p class="empty-state" id="knowledgeEmpty" hidden>没有符合当前条件的知识点，请调整搜索或筛选条件。</p>
  </main>
  <script src="config.js" onerror="this.remove()"></script><script type="module" src="js/knowledge.js?v=20260821-1"></script>
</body>
</html>
